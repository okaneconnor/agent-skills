name: workflow-skills
version: 1.0.0
description: >
  Development-workflow skills vendored from obra/superpowers, shipped as plain
  skills without the Superpowers plugin harness (no SessionStart hook, no
  using-superpowers bootstrap). Each skill loads only when its own description
  matches the task. No MCP server required.
author: okaneconnor
license: MIT
target: all

dependencies:
  apm:
    # Skills (vendored from obra/superpowers, MIT)
    - okaneconnor/agent-skills/.github/skills/brainstorming
    - okaneconnor/agent-skills/.github/skills/writing-plans
    - okaneconnor/agent-skills/.github/skills/executing-plans
    - okaneconnor/agent-skills/.github/skills/subagent-driven-development
    - okaneconnor/agent-skills/.github/skills/dispatching-parallel-agents
    - okaneconnor/agent-skills/.github/skills/using-git-worktrees
    - okaneconnor/agent-skills/.github/skills/test-driven-development
    - okaneconnor/agent-skills/.github/skills/systematic-debugging
    - okaneconnor/agent-skills/.github/skills/verification-before-completion
    - okaneconnor/agent-skills/.github/skills/requesting-code-review
    - okaneconnor/agent-skills/.github/skills/receiving-code-review
