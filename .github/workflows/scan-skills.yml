name: Scan Skills (SkillSpector)

on:
  pull_request:
    paths:
      - '.github/skills/**'

permissions:
  contents: read

concurrency:
  group: skillspector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skillspector:
    name: SkillSpector security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install SkillSpector (latest from main)
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git

      - name: Determine changed skills
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # Reduce changed paths under .github/skills/ to their top-level skill dir.
          git diff --name-only "$base" HEAD -- '.github/skills/**' \
            | sed -n 's#^\(\.github/skills/[^/]*\)/.*#\1#p' \
            | sort -u > changed_skills.txt
          count=$(grep -c . changed_skills.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed skill directories ($count):"
          cat changed_skills.txt

      - name: Scan changed skills
        if: steps.changed.outputs.count != '0'
        env:
          # Optional OpenAI LLM analysis. Absent -> scan runs static-only.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKILLSPECTOR_MODEL: ${{ vars.SKILLSPECTOR_MODEL }}
        run: |
          set -uo pipefail
          mkdir -p reports
          BASELINE_DIR=.github/skillspector-baselines
          DETAILS=$(mktemp)  # per-skill detail blocks, appended after the summary table

          # Choose static-only vs LLM-augmented analysis based on key presence.
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            export SKILLSPECTOR_PROVIDER=openai
            export SKILLSPECTOR_MODEL="${SKILLSPECTOR_MODEL:-gpt-4.1-mini}"
            LLM_ARGS=""
            LLM_MODE="OpenAI LLM (\`$SKILLSPECTOR_MODEL\`)"
          else
            LLM_ARGS="--no-llm"
            LLM_MODE="static-only (\`--no-llm\`)"
          fi

          # Report header + results table (rendered as markdown for humans;
          # the machine-readable JSON is kept as the uploaded artifact).
          {
            echo "# 🛡️ SkillSpector scan"
            echo ""
            echo "**Analysis mode:** $LLM_MODE  "
            echo "**Gate:** a skill **fails** when its recommendation is \`DO_NOT_INSTALL\` (risk > 50), or the scan errors."
            echo ""
            echo "| Skill | Result | Risk | Severity | Issues | Suppressed |"
            echo "| --- | --- | :-: | :-: | :-: | :-: |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          while IFS= read -r skill; do
            [ -z "$skill" ] && continue
            name=$(basename "$skill")

            # Apply a committed baseline for this skill if one exists
            # (accepts known/reviewed findings; only NEW findings count).
            baseline="$BASELINE_DIR/$name.json"
            BASELINE_ARGS=""
            base_note=""
            if [ -f "$baseline" ]; then
              BASELINE_ARGS="--baseline $baseline"
              base_note=" _(baseline)_"
            fi

            echo "::group::SkillSpector: $skill"
            # SINGLE scan per SkillSpector's CI contract: exit code = gate, JSON = detail.
            skillspector scan "$skill" $LLM_ARGS $BASELINE_ARGS \
              --format json --output "reports/$name.json"
            code=$?
            echo "::endgroup::"

            # Verdict fields live under .risk_assessment in the JSON schema.
            if [ -s "reports/$name.json" ]; then
              risk=$(jq -r '.risk_assessment.score // "?"'               "reports/$name.json" 2>/dev/null || echo "?")
              sev=$( jq -r '.risk_assessment.severity // "?"'            "reports/$name.json" 2>/dev/null || echo "?")
              rec=$( jq -r '.risk_assessment.recommendation // "UNKNOWN"' "reports/$name.json" 2>/dev/null || echo "UNKNOWN")
              nissues=$(jq -r '(.issues // []) | length'                 "reports/$name.json" 2>/dev/null || echo "?")
              nsupp=$(  jq -r '.suppressed_count // 0'                    "reports/$name.json" 2>/dev/null || echo "0")
            else
              risk="?"; sev="?"; rec="UNKNOWN"; nissues="?"; nsupp="0"
            fi

            case "$code" in
              0) icon="✅" ;;
              1) icon="❌"; fail=1 ;;
              *) icon="⚠️"; rec="ERROR (exit $code)"; fail=1 ;;
            esac

            # One row in the summary table.
            echo "| \`$name\`$base_note | $icon $rec | $risk | $sev | $nissues | $nsupp |" >> "$GITHUB_STEP_SUMMARY"

            # Collapsible per-skill detail, rendered from the JSON.
            {
              echo ""
              echo "<details><summary><strong>$icon \`$name\`</strong> — $rec (risk $risk, $sev)</summary>"
              echo ""
              if [ -s "reports/$name.json" ]; then
                echo "**Components scanned**"
                echo ""
                jq -r '
                  if ((.components // []) | length) == 0 then "_none_"
                  else (.components | map("- `\(.path)` — \(.type), \(.lines) lines, executable=\(.executable)") | join("\n"))
                  end' "reports/$name.json" 2>/dev/null || echo "_could not parse components_"
                echo ""
                echo "**Issues**"
                echo ""
                jq -r '
                  if ((.issues // []) | length) == 0 then "✅ _No issues found._"
                  else
                    "| Severity | Title | Component | Confidence |\n| --- | --- | --- | :-: |\n" +
                    (.issues | map("| \(.severity // .level // "?") | \(.title // .message // .name // .description // "?") | \(.component // .path // .file // "-") | \(.confidence // "-") |") | join("\n"))
                  end' "reports/$name.json" 2>/dev/null || echo "_could not parse issues_"
              else
                echo "_No report produced (scan errored). See job logs above._"
              fi
              echo ""
              echo "</details>"
            } >> "$DETAILS"
          done < changed_skills.txt

          # Append the detail blocks below the table.
          {
            echo ""
            echo "## Per-skill detail"
            cat "$DETAILS"
            echo ""
            echo "> Full JSON reports are attached as the **\`skillspector-reports\`** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "fail=$fail"
          exit "$fail"

      - name: Upload scan reports
        if: steps.changed.outputs.count != '0' && always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-reports
          path: reports/
          if-no-files-found: ignore

      - name: No skills changed
        if: steps.changed.outputs.count == '0'
        run: echo "No skill directories changed in this PR — nothing to scan."
